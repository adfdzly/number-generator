worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;                 # hide nginx version
    client_max_body_size 256k;         # this app needs only tiny requests

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ----------------------------------------------------------------------- #
    # Real client IP behind Cloudflare (so rate-limit keys are the visitor,
    # not the Cloudflare/edge or the tunnel container).
    # Source list: https://www.cloudflare.com/ips/
    # ----------------------------------------------------------------------- #
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # Docker/internal networks (the Cloudflare Tunnel container hops through here).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Honour the original scheme when proxied (Cloudflare sends https).
    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        "~."    $http_x_forwarded_proto;
    }

    # ----------------------------------------------------------------------- #
    # Rate limiting — throttle bots / scrapers / abuse.
    # ----------------------------------------------------------------------- #
    limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ----------------------------------------------------------------------- #
    # Block empty or known bad / automated user agents.
    # ----------------------------------------------------------------------- #
    map $http_user_agent $blocked_ua {
        default                                                              0;
        ""                                                                   1;
        "~*(bot|crawl|spider|scrape|httpclient|curl|wget|python-requests|libwww|nikto|sqlmap|masscan|nmap|zgrab|fuzz)" 1;
    }

    # Docker's embedded DNS. Combined with a *variable* in proxy_pass (see the
    # location block below), nginx resolves the "web" service at request time
    # instead of once at startup. This means recreating/restarting the web
    # container never crashes nginx with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name num-generator.aefoxlab.uk _;   # your domain (+ catch-all)

        # Security headers on every response.
        add_header X-Robots-Tag        "noindex, nofollow"  always;
        add_header X-Content-Type-Options "nosniff"          always;
        add_header X-Frame-Options     "DENY"               always;
        add_header Referrer-Policy     "no-referrer"         always;
        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

        # Reject bots up front.
        if ($blocked_ua) {
            return 403;
        }

        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location / {
            limit_req  zone=req_per_ip burst=20 nodelay;
            limit_conn conn_per_ip 20;

            # Variable forces runtime DNS resolution via the resolver above.
            # $request_uri is required so the path + query string still forward
            # correctly when proxy_pass contains a variable.
            set $web_upstream web;
            proxy_pass http://$web_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_read_timeout 60s;
        }
    }
}
